<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordine ricevuto | Chapeau Burger</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root { --nero:#1a1512; --crema:#fdf8f0; --arancio:#e87b1e; --arancio-scuro:#c85f0f; --verde:#2fa84f; --testo:#2b241c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Nunito Sans",sans-serif; background:var(--crema); color:var(--testo); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .box { background:white; border-radius:20px; padding:40px 30px; max-width:460px; width:100%; text-align:center; box-shadow:0 10px 30px rgba(26,21,18,0.12); }
  .icona { width:70px; height:70px; border-radius:50%; background:#e6f4ea; color:var(--verde); display:flex; align-items:center; justify-content:center; font-size:2rem; margin:0 auto 18px; }
  h1 { font-family:"Poppins",sans-serif; font-size:1.5rem; margin:0 0 10px; }
  p { opacity:0.75; margin:0 0 20px; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:13px 26px; border-radius:999px; font-weight:800; text-decoration:none; margin:6px; }
  .btn-whatsapp { background:#25d366; color:white; }
  .btn-menu { background:var(--arancio); color:white; }
  .btn-menu:hover { background:var(--arancio-scuro); }
</style>
</head>
<body>
  <div class="box">
    <div class="icona"><i class="fa-solid fa-check"></i></div>
    <h1>Ordine ricevuto!</h1>
    <p id="testo-ordine">Grazie per il tuo ordine da Chapeau Burger. Per confermarlo definitivamente, invialo su WhatsApp con il bottone qui sotto.</p>
    <div>
      <a href="#" id="link-whatsapp" class="btn btn-whatsapp" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> Conferma su WhatsApp</a>
      <a href="menu.html" class="btn btn-menu"><i class="fa-solid fa-book-open"></i> Torna al menu</a>
    </div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const ordineId = params.get("ordine");
  const waLink = params.get("wa");

  if (ordineId) {
    document.getElementById("testo-ordine").textContent = `Il tuo ordine #${ordineId} è stato registrato. Per confermarlo definitivamente, invialo su WhatsApp con il bottone qui sotto.`;
  }

  const linkWhatsapp = document.getElementById("link-whatsapp");
  if (waLink) {
    linkWhatsapp.href = waLink;
  } else {
    linkWhatsapp.style.display = "none";
  }
</script>
</body>
</html>
